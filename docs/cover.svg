<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#efe7d5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6a63a"/>
      <stop offset="1" stop-color="#c5821a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1a2238" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>

  <!-- faint notebook baselines -->
  <g stroke="#1a2238" stroke-opacity="0.05" stroke-width="1">
    <line x1="80" y1="150" x2="1120" y2="150"/>
    <line x1="80" y1="230" x2="1120" y2="230"/>
    <line x1="80" y1="310" x2="1120" y2="310"/>
    <line x1="80" y1="390" x2="1120" y2="390"/>
    <line x1="80" y1="470" x2="1120" y2="470"/>
  </g>
  <line x1="150" y1="60" x2="150" y2="570" stroke="#c0563f" stroke-opacity="0.18" stroke-width="2"/>

  <!-- brand -->
  <g transform="translate(82,74)">
    <rect width="40" height="40" rx="11" fill="#1a2238"/>
    <circle cx="20" cy="20" r="12.5" fill="none" stroke="url(#amber)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="59 100" transform="rotate(-90 20 20)"/>
    <circle cx="20" cy="20" r="4.2" fill="#df9a2e"/>
    <text x="56" y="29" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1a2238">Tutor<tspan fill="#c5821a">Stake</tspan></text>
  </g>

  <!-- headline -->
  <text x="174" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" fill="#1a2238" letter-spacing="-1">Pay your tutor</text>
  <text x="174" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" fill="#1a2238" letter-spacing="-1">per <tspan font-style="italic" fill="#c5821a">lesson.</tspan></text>

  <text x="176" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#6c7184">Deposit once. The escrow releases one session at a time —</text>
  <text x="176" y="424" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#6c7184">as the lessons actually happen. No platform in the middle.</text>

  <!-- session-pip strip: the lessons, released one at a time -->
  <g transform="translate(176,476)" filter="url(#soft)">
    <rect x="-18" y="-18" width="700" height="86" rx="18" fill="#fffdf7" stroke="#d8cfb8"/>
  </g>
  <g transform="translate(176,476)" font-family="Georgia, serif" font-size="22" font-weight="700">
    <!-- paid -->
    <g><rect width="44" height="44" rx="12" fill="url(#amber)"/><text x="22" y="30" text-anchor="middle" fill="#1a2238">✓</text></g>
    <g transform="translate(58,0)"><rect width="44" height="44" rx="12" fill="url(#amber)"/><text x="22" y="30" text-anchor="middle" fill="#1a2238">✓</text></g>
    <g transform="translate(116,0)"><rect width="44" height="44" rx="12" fill="url(#amber)"/><text x="22" y="30" text-anchor="middle" fill="#1a2238">✓</text></g>
    <!-- pending -->
    <g transform="translate(174,0)"><rect width="44" height="44" rx="12" fill="#fffdf7" stroke="#df9a2e" stroke-width="2.5"/><text x="22" y="30" text-anchor="middle" fill="#c5821a">4</text></g>
    <!-- to come -->
    <g transform="translate(232,0)"><rect width="44" height="44" rx="12" fill="#fffdf7" stroke="#d8cfb8" stroke-width="2"/><text x="22" y="30" text-anchor="middle" fill="#9a9caa">5</text></g>
    <g transform="translate(290,0)"><rect width="44" height="44" rx="12" fill="#fffdf7" stroke="#d8cfb8" stroke-width="2"/><text x="22" y="30" text-anchor="middle" fill="#9a9caa">6</text></g>
    <g transform="translate(348,0)"><rect width="44" height="44" rx="12" fill="#fffdf7" stroke="#d8cfb8" stroke-width="2"/><text x="22" y="30" text-anchor="middle" fill="#9a9caa">7</text></g>
    <g transform="translate(406,0)"><rect width="44" height="44" rx="12" fill="#fffdf7" stroke="#d8cfb8" stroke-width="2"/><text x="22" y="30" text-anchor="middle" fill="#9a9caa">8</text></g>
    <text x="480" y="20" font-family="Figtree, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6c7184">3 OF 8</text>
    <text x="480" y="40" font-family="Figtree, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6c7184">RELEASED</text>
  </g>

  <!-- right rail: the escrow as a ledger -->
  <g transform="translate(896,150)" filter="url(#soft)">
    <rect width="224" height="330" rx="20" fill="#1a2238"/>
  </g>
  <g transform="translate(896,150)" font-family="Figtree, Arial, sans-serif">
    <text x="26" y="46" font-size="12.5" font-weight="800" letter-spacing="2" fill="#df9a2e">THE ESCROW</text>
    <line x1="26" y1="62" x2="198" y2="62" stroke="#ffffff" stroke-opacity="0.12"/>

    <text x="26" y="104" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#fffdf7">$960</text>
    <text x="26" y="126" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9aa0b4">DEPOSITED UP FRONT</text>

    <text x="26" y="178" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#df9a2e">$360</text>
    <text x="26" y="200" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9aa0b4">PAID, LESSON BY LESSON</text>

    <text x="26" y="252" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#fffdf7">$600</text>
    <text x="26" y="274" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9aa0b4">STILL HELD FOR YOU</text>

    <line x1="26" y1="296" x2="198" y2="296" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="26" y="320" font-size="13" font-weight="700" fill="#fffdf7">Native USDC · on ARC</text>
  </g>

  <!-- footer -->
  <text x="82" y="600" font-family="Figtree, Arial, sans-serif" font-size="15" font-weight="600" fill="#6c7184">tutorstake-arc.vercel.app</text>
  <text x="1118" y="600" text-anchor="end" font-family="Figtree, Arial, sans-serif" font-size="15" font-weight="600" fill="#6c7184">Escrow that settles itself — one lesson at a time</text>
</svg>
