<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dg" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#b4dee9" opacity="0.05"/>
    </pattern>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10202a"/>
      <stop offset="1" stop-color="#0d1820"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#dg)"/>

  <!-- brand -->
  <g transform="translate(64,58)">
    <g transform="scale(0.9)">
      <path d="M14 18 A10 10 0 0 1 34 18" stroke="#4fcedf" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M34 32 A10 10 0 0 1 14 32" stroke="#4fcedf" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M30 18 L18 32" stroke="#4fcedf" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="34" cy="32" r="4.4" fill="#f4b63e" opacity="0.18"/>
      <circle cx="34" cy="32" r="2" fill="#f4b63e"/>
    </g>
    <text x="52" y="29" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#e8eef0" letter-spacing="-0.5">Tutor<tspan fill="#4fcedf">Stake</tspan></text>
  </g>

  <!-- headline -->
  <text x="62" y="246" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" fill="#e8eef0" letter-spacing="-1.5">Money on the table,</text>
  <text x="62" y="320" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5"><tspan fill="#f4b63e">released</tspan> <tspan fill="#e8eef0">one lesson</tspan></text>
  <!-- cyan dimension underline under "one lesson" -->
  <g stroke="#4fcedf" stroke-width="1.6">
    <line x1="340" y1="336" x2="610" y2="336"/>
    <line x1="340" y1="330" x2="340" y2="342"/>
    <line x1="610" y1="330" x2="610" y2="342"/>
  </g>
  <text x="62" y="394" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" fill="#e8eef0" letter-spacing="-1.5">at a time.</text>

  <text x="64" y="452" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c2d2d9">Escrow tutoring in native USDC — confirm a lesson,</text>
  <text x="64" y="481" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c2d2d9">exactly one lesson&#39;s pay is released. Instantly.</text>

  <!-- right: the escrow schematic card -->
  <rect x="712" y="150" width="424" height="300" rx="14" fill="#16242e" stroke="#2f4b5a" stroke-width="1"/>
  <g font-family="'DejaVu Sans Mono', Consolas, monospace">
    <text x="740" y="196" font-size="12" fill="#8da6b2" letter-spacing="1.6">8 LESSONS</text>
    <text x="1108" y="196" text-anchor="end" font-size="14" fill="#e8eef0">240.00 USDC</text>

    <!-- released callout -->
    <line x1="828" y1="248" x2="828" y2="222" stroke="#2f4b5a" stroke-width="1"/>
    <line x1="828" y1="222" x2="800" y2="222" stroke="#2f4b5a" stroke-width="1"/>
    <text x="796" y="218" text-anchor="end" font-size="13" fill="#f4b63e">+30.00 USDC</text>
    <text x="796" y="234" text-anchor="end" font-size="10" fill="#8da6b2" letter-spacing="0.8">RELEASED &#215;3</text>

    <!-- dimension line -->
    <line x1="748" y1="262" x2="1100" y2="262" stroke="#2f4b5a" stroke-width="1.4"/>
    <line x1="748" y1="254" x2="748" y2="270" stroke="#2f4b5a" stroke-width="1.4"/>
    <line x1="1100" y1="254" x2="1100" y2="270" stroke="#2f4b5a" stroke-width="1.4"/>

    <!-- ticks: 3 released (cyan + amber dot), 1 pending, 4 escrowed -->
    <g stroke-linecap="round">
      <line x1="772" y1="251" x2="772" y2="273" stroke="#4fcedf" stroke-width="2.6"/>
      <line x1="816.6" y1="251" x2="816.6" y2="273" stroke="#4fcedf" stroke-width="2.6"/>
      <line x1="861.1" y1="251" x2="861.1" y2="273" stroke="#4fcedf" stroke-width="2.6"/>
      <line x1="905.7" y1="248" x2="905.7" y2="276" stroke="#4fcedf" stroke-width="2.6"/>
      <line x1="950.3" y1="256" x2="950.3" y2="268" stroke="#5e7a88" stroke-width="1.6"/>
      <line x1="994.9" y1="256" x2="994.9" y2="268" stroke="#5e7a88" stroke-width="1.6"/>
      <line x1="1039.4" y1="256" x2="1039.4" y2="268" stroke="#5e7a88" stroke-width="1.6"/>
      <line x1="1084" y1="256" x2="1084" y2="268" stroke="#5e7a88" stroke-width="1.6"/>
    </g>
    <g>
      <circle cx="772" cy="262" r="6" fill="#f4b63e" opacity="0.18"/><circle cx="772" cy="262" r="3" fill="#f4b63e"/>
      <circle cx="816.6" cy="262" r="6" fill="#f4b63e" opacity="0.18"/><circle cx="816.6" cy="262" r="3" fill="#f4b63e"/>
      <circle cx="861.1" cy="262" r="6" fill="#f4b63e" opacity="0.18"/><circle cx="861.1" cy="262" r="3" fill="#f4b63e"/>
    </g>

    <!-- auto-settle bracket on lesson 4 -->
    <line x1="905.7" y1="276" x2="905.7" y2="312" stroke="#2f4b5a" stroke-width="1"/>
    <path d="M858 312 H954 M858 312 V318 M954 312 V318" stroke="#2f4b5a" stroke-width="1" fill="none"/>
    <text x="906" y="334" text-anchor="middle" font-size="11" fill="#8da6b2">{ 24h auto-settle window }</text>

    <!-- title block -->
    <rect x="996" y="396" width="112" height="36" fill="none" stroke="#2f4b5a" stroke-width="1"/>
    <line x1="996" y1="414" x2="1108" y2="414" stroke="#2f4b5a" stroke-width="1"/>
    <text x="1002" y="409" font-size="11" fill="#4fcedf" letter-spacing="1">DWG-01</text>
    <text x="1002" y="427" font-size="9" fill="#8da6b2" letter-spacing="0.6">ESCROW SCHEMATIC</text>
  </g>

  <!-- footer dimension divider -->
  <g stroke="#2f4b5a" stroke-width="1">
    <line x1="64" y1="566" x2="470" y2="566"/>
    <line x1="730" y1="566" x2="1136" y2="566"/>
    <line x1="64" y1="560" x2="64" y2="572"/>
    <line x1="1136" y1="560" x2="1136" y2="572"/>
  </g>
  <text x="600" y="570" text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#8da6b2" letter-spacing="1.4">ARC TESTNET · NATIVE USDC</text>
  <text x="64" y="604" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#8da6b2">tutorstake-arc.vercel.app</text>
  <text x="1136" y="604" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#8da6b2">Pay your tutor, one measured line at a time</text>
</svg>
